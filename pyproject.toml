[project]
name = "tg-message-collector"
version = "0.1.0"
description = "Telegram archive with MySQL, multilingual search and a read-only local MCP server"
requires-python = ">=3.12,<3.15"
dependencies = [
    "kurigram>=2.2.7,<3",
    "tgcrypto>=1.2.5,<2",
    "asyncmy>=0.2.10,<0.3",
    "mcp>=1.20,<2",
    "python-dotenv>=1,<2",
    "fastembed>=0.7,<0.8",
    "numpy>=2,<3",
    "usearch>=2.21,<3",
]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
